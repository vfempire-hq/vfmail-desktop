name: VF Mail — release build

on:
  workflow_dispatch:
    inputs:
      provision_signing_cert:
        description: "First-time only: generate the Developer ID Application cert via Fastlane Match"
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: mac-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux system libs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version '^2' --locked

      # macOS: fetch (or provision) the Developer ID Application cert via
      # Fastlane Match. Requires MATCH_PASSWORD + MATCH_GIT_TOKEN secrets.
      - name: Set up Ruby + Fastlane (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_MATCH == 'true'
        env:
          HAS_MATCH: ${{ secrets.MATCH_PASSWORD != '' && secrets.MATCH_GIT_TOKEN != '' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Write App Store Connect API key to disk (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_MATCH == 'true'
        env:
          HAS_MATCH: ${{ secrets.MATCH_PASSWORD != '' && secrets.MATCH_GIT_TOKEN != '' }}
        run: |
          mkdir -p ~/.appstoreconnect
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > ~/.appstoreconnect/AuthKey.p8
          chmod 600 ~/.appstoreconnect/AuthKey.p8

      - name: Provision Developer ID cert (first-time only)
        if: matrix.os == 'macos-latest' && env.HAS_MATCH == 'true' && github.event.inputs.provision_signing_cert == 'true'
        env:
          HAS_MATCH: ${{ secrets.MATCH_PASSWORD != '' && secrets.MATCH_GIT_TOKEN != '' }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_TOKEN }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: /Users/runner/.appstoreconnect/AuthKey.p8
        run: bundle exec fastlane mac provision_developer_id

      - name: Fetch Developer ID cert (every run)
        if: matrix.os == 'macos-latest' && env.HAS_MATCH == 'true'
        env:
          HAS_MATCH: ${{ secrets.MATCH_PASSWORD != '' && secrets.MATCH_GIT_TOKEN != '' }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_TOKEN }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: /Users/runner/.appstoreconnect/AuthKey.p8
        run: bundle exec fastlane mac fetch_developer_id

      - name: Discover signing identity (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_MATCH == 'true'
        id: signing
        env:
          HAS_MATCH: ${{ secrets.MATCH_PASSWORD != '' && secrets.MATCH_GIT_TOKEN != '' }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "Discovered: $IDENTITY"

      - name: Build (Tauri v2, macOS SIGNED + notarized)
        if: matrix.os == 'macos-latest' && env.HAS_MATCH == 'true'
        env:
          HAS_MATCH: ${{ secrets.MATCH_PASSWORD != '' && secrets.MATCH_GIT_TOKEN != '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Match already imported the cert to the runner's keychain.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization uses the API key.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: /Users/runner/.appstoreconnect/AuthKey.p8
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Build (Tauri v2, macOS UNSIGNED — Match not configured)
        if: matrix.os == 'macos-latest' && env.HAS_MATCH != 'true'
        env:
          HAS_MATCH: ${{ secrets.MATCH_PASSWORD != '' && secrets.MATCH_GIT_TOKEN != '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Build (Tauri v2, Linux + Windows)
        if: matrix.os != 'macos-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.sig' \) \
            -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: vfmail-${{ matrix.label }}
          path: out/*

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android

      - name: Install cargo-tauri + cargo-ndk
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo install cargo-ndk --locked

      - name: Install Android NDK 27.2.12479018
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          local-cache: true

      - name: Init Tauri Android project (idempotent)
        working-directory: src-tauri
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if [ ! -d gen/android ]; then
            cargo tauri android init
          fi

      - name: Build Android APK (unsigned debug for direct download)
        working-directory: src-tauri
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo tauri android build --debug --apk --split-per-abi
          find gen/android -name '*.apk' -exec ls -la {} \;

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/gen/android -name '*.apk' -exec cp {} out/ \;
          # Also produce sha256 alongside each APK
          for f in out/*.apk; do
            [ -f "$f" ] && sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: vfmail-android
          path: out/*

  publish:
    needs: [build, android]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          generate_release_notes: true

      - name: Deploy to inbox.vfempire.com/downloads/
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find dist-artifacts -type f -exec cp {} ../vfmail-workspace/app/downloads/ \;
          cd ../vfmail-workspace
          npx wrangler deploy
