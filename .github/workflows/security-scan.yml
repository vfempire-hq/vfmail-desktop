# .github/workflows/security-scan.yml
#
# Gitleaks secret-scanning workflow. Runs on:
#   - every push (any branch)
#   - every pull request (any branch)
#   - weekly cron (Monday 06:00 UTC — catches key rotations from other services)
#
# Fails the build if any secret pattern matches. Blocks PR merge on findings.
#
# Copy into every VF Empire public repo at .github/workflows/security-scan.yml.
#
# Runs the gitleaks binary directly (no wrapper action) so this workflow
# works identically on personal-account repos, organization-owned repos,
# and forks — no GITLEAKS_LICENSE secret required.

name: security-scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch: {}   # allow manual runs

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: '8.24.2'

jobs:
  gitleaks:
    name: gitleaks-secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Full git history required — gitleaks scans deleted commits + orphan branches
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd /tmp
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks against full history
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # detect scans full git log — commits, deleted files, orphan branches
          # --redact hides matched secret values from the log output
          # --verbose prints per-commit progress so failure output is actionable
          # Non-zero exit if any finding — fails the workflow
          gitleaks detect \
            --source . \
            --verbose \
            --redact \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --exit-code 1

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30
          if-no-files-found: ignore
